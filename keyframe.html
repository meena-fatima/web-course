    * {

    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .game {
        width: 95%;
        max-width: 600px;
        background: white;
        padding: 25px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
        margin-top: 0;
        color: #333;
    }

    #level {
        font-size: 18px;
        font-weight: bold;
        color: #666;
    }

    #question {
        font-size: 25px;
        font-weight: bold;
        margin: 30px 10px;
        color: #222;
    }

    .answers {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .answer {
        padding: 16px;
        border: none;
        border-radius: 15px;
        background: #4CAF50;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    .answer:hover {
        transform: scale(1.03);
        background: #388E3C;
    }

    #result {
        min-height: 30px;
        margin: 20px;
        font-size: 20px;
        font-weight: bold;
    }

    #next {
        display: none;
        background: #2196F3;
        color: white;
        border: none;
        padding: 15px 35px;
        border-radius: 15px;
        font-size: 18px;
        cursor: pointer;
    }

    #restart {
        display: none;
        background: #ff9800;
        color: white;
        border: none;
        padding: 15px 35px;
        border-radius: 15px;
        font-size: 18px;
        cursor: pointer;
    }

    .hard {
        color: #e53935;

</style>

let currentLevel = 0;
let score = 0;
let answered = false;


/*
==================================================
LOAD LEVEL
==================================================
*/

function loadLevel() {

    answered = false;

    const level = levels[currentLevel];

    document.getElementById("level").innerText =
        "Level " + (currentLevel + 1) + " / 100";

    document.getElementById("question").innerText =
        level.q;

    const buttons = document.querySelectorAll(".answer");

    buttons.forEach((button, index) => {

        button.innerText = level.a[index];

        button.style.display = "block";

        button.disabled = false;
    });

    document.getElementById("result").innerText = "";

    document.getElementById("next").style.display = "none";
}


/*
==================================================
CHECK ANSWER
==================================================
*/

function checkAnswer(selected) {

    if (answered) return;

    answered = true;

    const level = levels[currentLevel];

    const buttons = document.querySelectorAll(".answer");

    buttons.forEach(button => {
        button.disabled = true;
    });

    if (selected === level.correct) {

        score++;

        document.getElementById("result").innerText =
            "✅ CORRECT! 🧠";

    } else {

        document.getElementById("result").innerText =
            "❌ WRONG!";

    }

    document.getElementById("next").style.display =
        "inline-block";
}


/*
==================================================
NEXT LEVEL
==================================================
*/

function nextLevel() {

    currentLevel++;

    if (currentLevel >= levels.length) {

        showFinalScore();

    } else {

        loadLevel();
    }
}


/*
==================================================
FINAL SCORE
==================================================
*/

function showFinalScore() {

    document.getElementById("level").innerText =
        "🎉 GAME COMPLETE!";

    document.getElementById("question").innerText =
        "You completed all 100 levels!";

    document.querySelector(".answers").style.display =
        "none";

    document.getElementById("result").innerText =
        "Your Score: " + score + " / 100 🏆";

    document.getElementById("next").style.display =
        "none";

    document.getElementById("restart").style.display =
        "inline-block";
}


/*
==================================================
RESTART
==================================================
*/

function restartGame() {

    currentLevel = 0;

    score = 0;

    document.querySelector(".answers").style.display =
        "grid";

    document.getElementById("restart").style.display =
        "none";

    loadLevel();
}


/*
==================================================
START GAME
==================================================
*/

loadLevel();
